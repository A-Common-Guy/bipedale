[project]
name = "sandro-rl"
version = "0.1.0"
description = "GPU-parallel RL locomotion training for the Sandro wheeled biped (MuJoCo Warp via MJX, PPO in JAX)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.16.0",
    "mujoco-mjx==3.16.0",
    "mujoco-warp==3.16.0",
    "warp-lang==1.18.0",
    "jax[cuda13]==0.11.2",
    "flax==0.12.10",
    "optax==0.2.8",
    "numpy>=2.2",
    "pyyaml>=6.0",
    "onnx>=1.18",
    "onnxruntime>=1.22",
    "matplotlib>=3.10",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandro_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the CUDA GPU (MuJoCo Warp)",
]
