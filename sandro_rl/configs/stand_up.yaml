# Stand up from switched off, then balance and drive as flat_level.
#
# Most episodes start from a limp rest pose (data/fallen_states.npz, made by
# python -m sandro_rl.fallen): legs folded until their links meet, the robot
# leaning on a folded crank or lying on the motor holders, nose down or up.
# The rest start standing, so the policy keeps its balance skills. Only this
# config collides the leg links (collision.py); there is no fall termination,
# and tracking pays only once upright.
#
#     uv run python -m sandro_rl.train configs/stand_up.yaml --resume policies/flat_level
#
# Early on an upward pull on the torso (init.fallen.assist_n, while it is
# low) helps exploration find standing; the curriculum takes it to zero.
inherit: flat_level.yaml

env:
  naconmax_per_env: 40          # tyres, torso shell and leg boxes on the floor, link stops
  njmax_per_env: 240
  collision:
    leg_boxes: true

  action:
    legs: {kp: 20.0, kd: 0.6, scale_rad: 0.8}

  init:
    fallen: {fraction: 0.7, states: data/fallen_states.npz, assist_n: 30.0}

  termination:
    tilt_rad: 3.2               # never: lying down is the start, not a failure
    imu_height_m: -1.0

  constraints:
    # Getting up out of a fold saturates the 9 Nm peak (x 0.85-1.15 drive
    # spread): the cap is the limit, not a constraint.
    leg_torque: {limit: 12.0, slack: 0.5}
    tilt: {limit_rad: 3.2, slack: 0.3}
    stretch: {limit: 0.97, slack: 0.02, upright_rad: 0.5}
    height: {margin_m: 0.2, slack: 0.01}        # folded legs are far below the commandable range
    joint_range: {margin_rad: -3.0, slack: 0.1} # and outside the controller's joint range
    wheel_lift: null
    leg_split: {limit_m: 0.02, slack: 0.03, upright_rad: 0.3}

  rewards:
    upright_gate_rad: 0.4
    stand_height_from_m: 0.15   # about the IMU's height lying down
    weights:
      upright: 6.0              # (1 + cos tilt) / 2
      stand_height: 10.0        # IMU height from 0.15 m to standing, 0 to 1

# RlPolicyController settings for this policy (export_ros.py; start_lying
# follows from env.init.fallen). After getting up the legs swing at up to
# 1.9 rad/s and the wheels 5.9 rad/s in the watchdog's 5-15 Hz band for about
# 3 s, 0.8 and 2.3 afterwards, driving and 80 ms of wheel lag included
# (checkpoint 500 of runs/stand_up_body2611, every fall of the evaluation).
deploy:
  safety:
    oscillation_arm_delay_s: 3.0
    oscillation_leg_rad_s: 1.2
    oscillation_wheel_rad_s: 5.0

curriculum:
  stages:
    - iteration: 0
      set: {env.init.fallen.assist_n: 30.0}
    - iteration: 600
      set: {env.init.fallen.assist_n: 15.0}
    - iteration: 1200
      set: {env.init.fallen.assist_n: 0.0}

train:
  iterations: 3000
  num_envs: 4096                # the leg boxes' contact buffers: 8192 do not fit in 16 GB
  steps_per_env: 48
  gamma: 0.995                  # getting up takes seconds: a 2 s horizon at 100 Hz
  learning_rate: 3.0e-4
  resume_log_std: -1.0          # flat_level's action noise is 0.04
