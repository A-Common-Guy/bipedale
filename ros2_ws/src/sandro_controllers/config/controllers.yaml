controller_manager:
  ros__parameters:
    update_rate: 300
    driving_balancer:
      type: sandro_controllers/DrivingBalancerController
    timed_effort:
      type: sandro_controllers/TimedEffortController

driving_balancer:
  ros__parameters:
    joints: [right_motor_inner, right_motor_outer, right_wheel,
             left_motor_inner, left_motor_outer, left_wheel]
    imu_name: imu
    command_topic: ~/cmd_vel
    diagnostics.publish_rate_hz: 10.0
    legs:
      right: {base_m: 0.09, upper_m: 0.08, lower_m: 0.13}
      left: {base_m: 0.09, upper_m: 0.08, lower_m: 0.13}
      height_m: 0.17
      height_rate_m_s: 0.03
      kp_nm_rad: 12.0
      kd_nm_s_rad: 0.5
      torque_limit_nm: 3.0
      target_rate_rad_s: 6.0
      joint_min_rad: -2.0943951024
      joint_max_rad: 2.0943951024
    balance:
      pitch_target_rad: 0.0
      pitch_kp_nm_rad: 15.0
      pitch_kd_nm_s_rad: 0.65
      wheel_damping_nm_s_rad: 0.1
      torque_limit_nm: 6.0
      torque_rate_nm_s: 100.0
      torque_sign: 1.0
      imu_timeout_s: 0.15
      settle_s: 1.0
      ramp_s: 0.5
      fall_angle_rad: 1.0
    wheels:
      torque_limit_nm: 6.0
    drive:
      wheel_radius_m: 0.0742
      track_width_m: 0.304
      max_forward_velocity_m_s: 0.5
      max_yaw_rate_rad_s: 1.5
      forward_accel_limit_m_s2: 1.0
      velocity_kp_pitch_s_m: 0.12
      velocity_ki_pitch_per_m: 0.02
      velocity_integral_limit_rad: 0.05
      max_pitch_offset_rad: 0.15
      velocity_to_pitch_sign: 1.0
      position_hold_kp_s: 1.0
      position_hold_velocity_limit_m_s: 0.15
      command_deadband_m_s: 0.01
      yaw_kp_nm_s_rad: 0.15
      yaw_torque_limit_nm: 0.4
      yaw_torque_rate_nm_s: 3.0
      yaw_torque_sign: 1.0
      command_timeout_s: 0.3

# Minimal commissioning example. Activate this instead of driving_balancer,
# then continuously publish six efforts to ~/commands.
timed_effort:
  ros__parameters:
    joints: [right_motor_inner, right_motor_outer, right_wheel,
             left_motor_inner, left_motor_outer, left_wheel]
    command_topic: ~/commands
    command_timeout_s: 0.1
    effort_limit_nm: 0.5
