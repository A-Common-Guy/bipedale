# Identified physical parameters folded into the generated ROS MuJoCo model
# (mjcf/robot_ros2.xml) by tools/sync_model.py. The CAD export supplies
# geometry, masses and loop closure; everything here is what the CAD cannot
# know and what the measured robot showed. Regenerate after every change:
#
#     ros2_ws/src/sandro_description/tools/sync_model.py sync
#
# Values marked "CAD" or "default" have not been identified yet; the
# procedure to measure each one is in sandro_bringup/docs/SIM_TO_REAL.md.

# Tyre contact. The export's tyre cylinders used MuJoCo defaults: condim 3
# (no torsional friction), sliding friction 1.0, contact time constant 20 ms.
# A rubber tyre on a hard floor resists twisting about the contact normal, and
# that scrub is what makes real turning slower than the frictionless-yaw
# simulation. condim 4 adds torsional friction (unit: metres, roughly the
# contact patch radius times the friction coefficient).
tyre:
  # Contact radius under load. The airless tyres (CAD 0.0742 m free) squash
  # 6 to 8 mm with the robot standing on them (2026-10-21, by eye); MuJoCo's
  # contact cannot squash that far, so the contact cylinder is the loaded
  # radius instead: axle height and the axle-to-ground lever are right, the
  # vertical spring of the tyre is missing. The simulated rolling radius is
  # then this too; the controllers' model.wheel_radius_m follows it.
  radius_m: 0.0672
  condim: 4
  # Torsional friction from the turning comparison (recordings/*2026-09-20):
  # the robot needed 0.37 Nm of differential torque for 0.22 rad/s of yaw;
  # 0.004 gave 0.55 rad/s for 0.16 Nm in simulation and 0.02 still 0.55 rad/s
  # for 0.28 Nm. Refine with the next turning comparison.
  # Sliding 0.8: in the recorded turn the wheel-differential yaw (0.225 rad/s)
  # matched the gyro (0.215), so the real tyres do not skid on that floor; a
  # trial at 0.35 made the simulated wheels spin seven times faster than the
  # body yawed. Torsional 0.07: the robot needed 0.37 Nm of differential
  # torque per 0.22 rad/s of yaw (about 1.7 Nm per rad/s of scrub), 0.05 gave
  # about 1.3 in simulation. Refine with the next turning comparison.
  friction: [0.8, 0.07, 0.0001]    # sliding, torsional, rolling (rolling unused at condim 4)
  solref: [0.01, 1.0]              # 10 ms contact time constant: stiffer than default

# Drive dynamics per group, as seen at the joint (output side). The CAD export
# carries armature 0.000168 (reflected rotor inertia from the legacy fit),
# damping 0.01 and Coulomb frictionloss 0.1 Nm. Identify with the lifted-robot
# excitation (SandroControl/fit_sysid.py) and copy the accepted fit here.
joints:
  legs:   {damping: 0.01, frictionloss: 0.1, armature: 0.000168}   # CAD / legacy fit
  # Wheels 0.2 Nm: real2_2026-09-20 needed 0.43 Nm of average torque for
  # almost no acceleration, i.e. about 0.4 Nm of friction across both drive
  # trains and tyres. Refine with a coast-down or the lifted-robot fit.
  wheels: {damping: 0.01, frictionloss: 0.2, armature: 0.000168}

# Ratio of delivered joint torque to the torque the drive reports. 1.0 until
# measured (a load cell on a lever, or the fit above).
actuators:
  legs:   {torque_scale: 1.0}
  wheels: {torque_scale: 1.0}

# Weighed component masses (kg), 2026-10-21. The CAD export's body masses are
# replaced by these; each CAD body keeps its centre of mass and its inertia is
# scaled by the same ratio. Components are found through the joints, not CAD
# body names, so a re-exported CAD keeps them:
#   central_hub_kg           torso body: frame, electronics, cabling, every
#                            bracket; everything but the four leg motors
#   leg_motor_kg             each of the four, on the jointless holder bodies
#                            that carry the leg motor joints (assumed, not
#                            weighed individually)
#   upper_crank_kg           each body of a leg motor joint, bearings included
#   lower_links_per_side_kg  the two passive-joint bodies of one leg together:
#                            both lower cranks, the wheel motor stator and the
#                            two coupling shafts to the upper cranks; split
#                            between the two in the CAD proportion
#   wheel_kg                 each wheel joint body: hub, tyre, motor rotor
# total_kg is the whole robot on the scale; sync fails if the components do
# not add up to it within 1 g. Weighed without a battery (bench supply):
# weigh again, and redo the tilt weighing, once one is fitted.
masses:
  total_kg: 4.825
  central_hub_kg: 1.145
  leg_motor_kg: 0.388
  upper_crank_kg: 0.112
  lower_links_per_side_kg: 0.670
  wheel_kg: 0.170

# Part of the central hub's mass, in the IMU frame (x forward, y left, z up),
# placed where the tilt weighing puts the CoM (tools/com_from_weighing.py
# --write). It is taken out of central_hub_kg, so the total stays the weighed
# one; it also carries the training's payload mass and offset randomisation.
# Zero disables it (and then the hub is the CAD torso body alone).
# The hub was reported slightly rear-heavy: until the tilt weighing, 0.4 kg
# sits 20 mm behind the CAD torso's centre of mass.
payload:
  mass_kg: 0.4
  position_m: [-0.012, 0.038, -0.058]
  half_size_m: [0.04, 0.06, 0.03]

# IMU mounting. Both hardware recordings show the leg kinematics 14 mm
# asymmetric while the IMU reads the body level, i.e. the IMU roll is biased
# by about -0.049 rad (right-side-down positive). The simulated IMU is
# rotated by the same amount so tasks.roll.imu_offset_rad in the per-robot
# overrides means the same thing on both backends.
imu_mount:
  roll_offset_rad: -0.049

# Sensor noise standard deviations for the simulated IMU (quaternion
# components, rad/s, m/s^2). The export's 0.017 on the quaternion is about a
# degree of attitude noise, pessimistic for a BNO085 game rotation vector;
# measure it from a standing recording (compare_runs.py, phase with v=0).
imu_noise:
  orientation: 0.005
  gyro: 0.002
  accelerometer: 0.02
