# Per-robot values identified on the physical Sandro, applied on top of
# controllers.yaml with:
#
#   ros2 launch sandro_bringup sandro.launch.py hardware:=real arm_hardware:=true \
#     controller:=whole_body_controller teleop:=true \
#     extra_params:=$(ros2 pkg prefix sandro_bringup)/share/sandro_bringup/config/sandro_real_overrides.yaml
#
# Use the same file for the simulation once sandro_description/config/
# sim_identified.yaml carries the matching payload, so both backends describe
# the same robot. Source of each value: the 2026-09-20 drive_test recording
# (recordings/real_2026-09-20.csv) compared with the simulation, see
# docs/SIM_TO_REAL.md. Replace the estimates with measurements as they come.
whole_body_controller:
  ros__parameters:
    model:
      # Weighed 2026-10-21: 4.825 kg minus two 170 g wheels, no battery, plus
      # the D435 and its bracket (0.099, not weighed) since 2026-11-18.
      body_mass_kg: 4.584
    balance:
      # Second recording (real2_2026-09-20): 0.43 Nm of average wheel torque
      # produced almost no acceleration, about 0.2 Nm of Coulomb friction per
      # drive train and tyre. Compensate part of it; more is negative damping.
      wheel_friction_ff_nm: 0.12
    tasks:
      roll:
        # IMU roll when the body is level. The -0.049 identified on the UART
        # IMU (2026-09-20) no longer fits the SPI6 mounting on the Pi: with it
        # the roll integral stood the right leg 21 mm taller than the left at
        # every height (pi_whole_body_controller_2026-10-19, differential
        # -19.4 mm), a 0.064 rad body tilt on a flat floor, so the mounting
        # bias is about +0.016. Confirm with a spirit level on the body: if it
        # reads level while the legs still differ, the leg zeros differ instead.
        imu_offset_rad: 0.016
      height:
        # With the neutral 8 mm back the front pivot keeps its 3 % stretch
        # margin up to 0.185 m over the +-25 mm leg offset range.
        max_m: 0.185
      fore_aft:
        # Where the centre of mass is: in the calm standing phase of all
        # three hardware runs the axle stood 33 to 40 mm ahead of the pivot
        # centre, at body-forward 0.037 to 0.038 m with the body level, so
        # the mass sits 7 to 8 mm behind the CAD neutral (0.045). The earlier
        # -0.028 and -0.040 came from trim_m, which had learnt the forward
        # lean the robot held against wheel stiction while it crept (0.4 Nm of
        # wheel torque, no motion), not a mass offset. With -0.040 the legs
        # stood pinned 28 mm off their neutral, the trim pinned at its limit,
        # the body leaned back 2.6 degrees, and the balance loop hunted at
        # 2 Hz between the leg offset limits as soon as it drove.
        neutral_offset_m: -0.008
      yaw:
        # The turn needed 0.37 Nm on average and hit the 1 Nm limit for only
        # 0.22 rad/s of 0.6 commanded: real tyre scrub is several times the
        # simulated one. Balance keeps priority inside the per-wheel budget.
        # The scrub is fed forward as a Coulomb-like term (real2: about
        # 0.35 Nm of differential torque held 0.5 rad/s); do not raise
        # kp_nm_s_rad to get the rate, the 1.5 tried in the third run rang
        # at 3.6 Hz with +-0.8 Nm while standing (docs/SIM_TO_REAL.md).
        torque_limit_nm: 2.0
        scrub_ff_nm: 0.35

# The sandro_rl policies (rl_policies.yaml) take the same physical IMU
# mounting as tasks.roll.imu_offset_rad above.
rl_flat_level:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
rl_flat_level_fast:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
rl_flat_level_sysid:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
rl_flat_level_fast_sysid:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
rl_agile_terrain:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
    action:
      # Without it the policy pumps the robot's 9 Hz yaw mode (the wheels
      # against each other through the gear play); at 3 Hz it stays quick
      # and quiet (2026-11-12 and 16, sandro_rl/docs/DESIGN.md).
      wheel_differential_filter_hz: 3.0
rl_agile_terrain_v3:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
# Trained inside the measured yaw and roll loop margins (2026-11-17): no
# wheel_differential_filter_hz, the margin is for the unfiltered command.
rl_agile_terrain_v5:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
# v5 with a margin of 0.35 (2026-11-18): no crossing left on the measured
# plants, with or without action.wheel_differential_filter_hz.
rl_agile_terrain_v6:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
# The three answers to the terrain ahead (2026-11-18, sandro_rl/docs/DESIGN.md
# section 15): drive over low edges, hop onto steps of up to about 5 cm, stop
# before anything taller. Needs camera:=true; without /terrain_profile it
# drives blind and climbs nothing. L1 + cross hops on request.
rl_agile_step:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
# rl_agile_step retrained on the errors the robot's own perception makes
# (2026-11-20, sandro_rl/docs/DESIGN.md section 17). Same inputs and buttons.
rl_agile_step_v2:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
rl_stand_up:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
# rl_stand_up retrained on slippery floors, weak drives and the measured
# left-against-right plants (2026-11-18, sandro_rl/docs/DESIGN.md stand_up_v2).
rl_stand_up_v2:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
# For fun (2026-11-19, sandro_rl/docs/DESIGN.md section 16): a split stance,
# up to 2 m/s (the drives' speed limit permitting), and standing on the left
# wheel on L1 + cross.
rl_fun_split:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
rl_fun_fast:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
rl_fun_one_leg:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
# The same held for 8 s per request.
rl_fun_one_leg_long:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016

# The terrain profile (sandro_perception) takes the same physical IMU mounting
# as the controllers above.
height_profile:
  ros__parameters:
    imu:
      roll_offset_rad: 0.016
