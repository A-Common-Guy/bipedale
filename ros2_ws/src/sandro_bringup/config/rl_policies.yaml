      # sandro_perception's /terrain_profile at [0.1, 0.2, 0.3, 0.45, 0.6, 0.8, 1.05, 1.35] m
      # ahead of each wheel: start the stack with camera:=true. Without a
      # profile the policy drives blind.
      profile_size: 32
      profile_height_scale: 10.0
      profile_clip_m: [-0.15, 0.25]
      gyro_scale: 0.25
      leg_velocity_scale: 0.1
      wheel_velocity_scale: 0.05
      # The simulated IMU's mounting (sim_identified.yaml imu_mount); the
      # robot overrides set the physical one.
      imu_offset_rad: -0.049
