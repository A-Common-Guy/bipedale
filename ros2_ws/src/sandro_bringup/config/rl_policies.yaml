      forward_m_s: 1.0
      yaw_rad_s: 3.0
      height_min_m: 0.09
      height_max_m: 0.19
      roll_rad: 0.3
      jump_height_max_m: 0.08
      jump_window_s: 0.8
      # Height command on engaging (the WBC's tasks.height.target_m); the
      # reference starts at the measured height and moves there.
      initial_height_m: 0.17
