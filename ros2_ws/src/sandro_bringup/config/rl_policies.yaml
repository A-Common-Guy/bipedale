    policy_fingerprint: 107fb7830e78e44a9361c60031d8f2f982332f272bf2e3804b3578220a72ab31
    policy_rate_hz: 100.0
    observation:
      history: 4
      history_stride: 1
      command_size: 4
      # A hop on /cmd_vel linear.y (the wheel clearance asked for, m; the
      # gamepad's L1 + cross): its rising edge opens one window.
