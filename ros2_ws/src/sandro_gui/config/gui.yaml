# sandro_gui: the control panel the robot serves on http://<pi>:8080.
# Command-line flags of `ros2 run sandro_gui sandro_gui` override these.

server:
  host: 0.0.0.0
  port: 8080
  fast_rate_hz: 20     # joints, IMU, gamepad and rates to the browser
  slow_rate_hz: 2      # controllers, hardware, CAN, system, Bluetooth

launch:
  # real on the robot. On a development machine run the GUI with
  # --hardware mujoco to drive the simulation instead.
  hardware: real
  # Passed to every real-hardware launch, as deploy/pi/pi launch does
  # (its LAUNCH_DEFAULTS); keep the two in step.
  args: [imu_transport:=spi, imu_spi_device:=/dev/spidev6.0, rviz:=false]
  simulation_args: [headless:=true, rviz:=false]
  # sandro_bringup/config file applied as extra_params when "robot overrides"
  # is ticked: the identified per-robot values.
  overrides: sandro_real_overrides.yaml
  # Stop is one SIGINT, as Ctrl-C: the controller manager deactivates the
  # drives before it exits. SIGTERM after this long, SIGKILL 5 s later.
  stop_timeout_s: 20.0
  runs_dir: gui_runs   # launch output, relative to the working directory
  # Oldest run logs are deleted beyond either limit (the running one never).
  keep_runs: 30
  keep_mb: 200

can:
  interface: can0
  # Passive listener (read only): per-drive frame rates, axis state, errors
  # and encoder angles, also before the drives are armed.
  monitor: true
  # E-STOP also sends the GIM6010 E-stop frame from the panel's own socket,
  # before any ROS call: it works with no launch and no DDS. Nothing else is sent.
  estop: true

robot:
  hardware_component: SandroSystem
  imu_component: SandroImu
  estop_service: /gim6010_estop/trigger
  clear_errors_service: /gim6010_estop/clear_errors
  # A starting stack is ready once these are active; they are restarted after
  # the drives are armed again (their read error deactivates them).
  broadcasters: [joint_state_broadcaster, imu_broadcaster, health_broadcaster]
  # Controllers the Run page offers, in this order.
  # The two sysid policies are listed for the Sysid page's buzz recording only
  # (they buzz and are slow: sandro_rl/docs/DESIGN.md); they are not on the
  # gamepad switch.
  controllers: [whole_body_controller, rl_agile_terrain_v6, rl_agile_step, rl_agile_step_v2, rl_agile_terrain_v5, rl_agile_terrain_v3, rl_agile_terrain, rl_flat_level, rl_flat_level_fast,
                rl_stand_up, rl_stand_up_v2, rl_stand_up_v4, rl_fun_split, rl_fun_fast, rl_fun_one_leg, rl_fun_one_leg_long, rl_fun_show, rl_fun_stride, rl_fun_bow, rl_fun_hop_high, rl_fun_one_leg_v4, rl_agile_terrain_v7, rl_agile_terrain_v8, lqr_balancer, driving_balancer,
                rl_flat_level_sysid, rl_flat_level_fast_sysid]

# The Drive page: on-screen sticks, for a phone. The panel publishes them as
# /joy while the browser keeps posting, so joy_teleop treats them as the
# gamepad (sandro_gui/touch.py). A connected gamepad has priority.
touch:
  timeout_s: 0.35          # a post older than this ends the driving (released pads follow)
  release_s: 1.0           # how long released pads are published after it
  max_speed_fraction: 1.0  # the page's speed slider tops out here (of the controller's limits)
  rate_hz: 20.0            # as joy_node's autorepeat

# Topics watched for rate and freshness. expect_hz is what a healthy running
# stack delivers (the 300 Hz control loop publishes the sensors every cycle).
# sampled: high-rate topics the panel's ticker drains 20 times a second
# instead of the executor waking for every message.
topics:
  - {name: /joint_states, type: sensor_msgs/msg/JointState, expect_hz: 300, sampled: true}
  - {name: /imu_broadcaster/imu, type: sensor_msgs/msg/Imu, expect_hz: 300, sampled: true}
  # Drive health (feedback_age, online, errors, IMU age) at 10 Hz.
  - {name: /health_broadcaster/dynamic_joint_states, type: control_msgs/msg/DynamicJointState,
     expect_hz: 10}
  - {name: /joy, type: sensor_msgs/msg/Joy, expect_hz: 20}
  - {name: /cmd_vel, type: geometry_msgs/msg/TwistStamped, expect_hz: 50, while: deadman}
  # The terrain ahead of the wheels from the depth camera (sandro_perception).
  - {name: /terrain_profile, type: std_msgs/msg/Float32MultiArray, expect_hz: 25, while: camera}
# Also read, not listed in Streams: the 300 Hz health topic of stacks from
# before health_broadcaster. The fresher of the two is used.
legacy_topics:
  - {name: /dynamic_joint_states, type: control_msgs/msg/DynamicJointState, sampled: true}
# Oldest sample the drivers may hand the controllers (their imu/age and
# feedback_age state interfaces): the BNO085 reports every 5 ms, the drives
# broadcast their encoders every 5 ms.
expect:
  imu_max_age_ms: 25
  encoder_max_age_ms: 25
  # The drives' torque envelope peak (hard_effort_limit_nm); a drive whose
  # effort_limit is below it is being protected from heat.
  drive_peak_nm: 9.0

software:
  # The Software page, under the working directory (/workspaces/sandro on the
  # robot): a bare repository that deploy/pi/pi push fills from the laptop and
  # Fetch from GitHub; a deploy writes one commit's ros2_ws/src and builds it.
  repo: repo.git
  remote: https://github.com/A-Common-Guy/bipedale.git
  branch: main               # the branch the page opens on
  skip_packages: [sandro_sim]  # not built on the robot (deploy/pi/pi sync skips it too)

sysid:
  # The Sysid page's runs (recording, analysis, yaw_plant.json), under the
  # working directory: ~/sandro/experiments on the robot, where
  # deploy/pi/pi sysid writes too.
  dir: experiments

log:
  # Launch output lines containing any of these are dropped. joy_node logs
  # every DualSense touchpad and motion event SDL does not map.
  ignore: ["Unknown event type"]

model:
  mjcf: robot_full_floating.xml   # in sandro_description/mjcf
  cell_mm: 1.0                    # vertex clustering grid for the browser meshes
  min_part_mm: 10.0               # parts smaller than this are left out
