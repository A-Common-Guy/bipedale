# The D435 on the front bracket and the terrain profile made from it
# (sandro_perception/height_profile.py). Per-robot corrections go in
# sandro_bringup/config/sandro_real_overrides.yaml, as for the controllers.
camera:
  camera:
    ros__parameters:
      # Depth only, small and slow: this shares the Pi with the 300 Hz loop.
      enable_depth: true
      enable_color: false
      enable_infra1: false
      enable_infra2: false
      enable_sync: false
      depth_module.depth_profile: "424x240x15"
      pointcloud.enable: false
      align_depth.enable: false
      publish_tf: false

height_profile:
  ros__parameters:
    publish_hz: 25.0
    mount:
      # The depth origin (the D435's left imager) in the body frame, whose
      # origin is the IMU: the CAD camera on the 20-degree bracket
      # (onshape_export/camera_mount.py), the same pose as camera_link in the
      # URDF (sandro_description test_description.py checks both). Check it
      # on a flat floor after every change to the bracket: ~/diagnostics
      # floor_pitch_deg trims pitch_rad, floor_offset_mm z_m. With the wrong
      # pitch a flat floor reads up to +0.25 m, all known, and the diagnostics
      # give no floor fit.
      x_m: 0.11411
      y_m: 0.0175
      z_m: 0.00056
      pitch_rad: 0.349066       # positive looks down
      roll_rad: 0.0
      yaw_rad: 0.0
    imu:
      roll_offset_rad: 0.0      # tasks.roll.imu_offset_rad of the controllers
    layout:
      # Where the profile is sampled, m ahead of each axle. A contract with
      # the policies trained on it: do not change it under a deployed policy.
      distances_m: [0.10, 0.20, 0.30, 0.45, 0.60, 0.80, 1.05, 1.35]
      half_track_m: 0.152
    depth:
      stride: 2
      min_range_m: 0.25
      max_range_m: 2.5
    map:
      cell_m: 0.04
      max_age_s: 8.0
