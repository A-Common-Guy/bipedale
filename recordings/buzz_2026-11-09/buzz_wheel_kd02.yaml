# Buzz test: sandro_real_overrides.yaml with the policies' wheel drive damping
# at 0.2 instead of 0.4. Not trained at this value.
whole_body_controller:
  ros__parameters:
    model:
      body_mass_kg: 4.485
    balance:
      wheel_friction_ff_nm: 0.12
    tasks:
      roll:
        imu_offset_rad: 0.016
      height:
        max_m: 0.185
      fore_aft:
        neutral_offset_m: -0.008
      yaw:
        torque_limit_nm: 2.0
        scrub_ff_nm: 0.35
rl_flat_level:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
    action:
      wheel_kd_nm_s_rad: 0.2
rl_flat_level_fast:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
    action:
      wheel_kd_nm_s_rad: 0.2
rl_agile_terrain:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
rl_stand_up:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
