# Yaw-buzz test: sandro_real_overrides.yaml plus a 3 Hz low-pass on the opposed
# half of the wheel commands of the balancing policies (action.
# wheel_differential_filter_hz; 0 off). The common half, which balances,
# is unfiltered. Not trained with; try 2-4 Hz.
whole_body_controller:
  ros__parameters:
    model:
      body_mass_kg: 4.485
    balance:
      wheel_friction_ff_nm: 0.12
    tasks:
      roll:
        imu_offset_rad: 0.016
      height:
        max_m: 0.185
      fore_aft:
        neutral_offset_m: -0.008
      yaw:
        torque_limit_nm: 2.0
        scrub_ff_nm: 0.35
rl_flat_level:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
    action:
      wheel_differential_filter_hz: 3.0
rl_flat_level_fast:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
    action:
      wheel_differential_filter_hz: 3.0
rl_flat_level_drivetrain:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
    action:
      wheel_differential_filter_hz: 3.0
rl_flat_level_fast_drivetrain:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
    action:
      wheel_differential_filter_hz: 3.0
rl_agile_terrain:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
    action:
      wheel_differential_filter_hz: 3.0
rl_stand_up:
  ros__parameters:
    observation:
      imu_offset_rad: 0.016
